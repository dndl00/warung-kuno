<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulasi Warung Makan Kuno China - Ultimate Edition</title>
  <style>
    :root {
      --ink: #28170e;
      --wood: #59331d;
      --wood-dark: #2e180e;
      --paper: #f3dfaf;
      --red: #9b1d1d;
      --gold: #eab95e;
      --furniture-color: linear-gradient(#9e5e2d, #643316);
      --furniture-border: #2d160a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body, html {
      width: 100%; height: 100vh; overflow: hidden;
      font-family: "Georgia", serif; background: #23150e;
    }

    @media screen and (orientation: portrait) {
      #warning-screen { display: flex !important; }
      .game-container { display: none !important; }
    }
    
    #warning-screen {
      display: none; width: 100vw; height: 100vh; background: #23150e;
      color: #eab95e; flex-direction: column; justify-content: center;
      align-items: center; text-align: center; padding: 20px; font-weight: bold;
    }

    .game-container { display: flex; height: 100vh; width: 100vw; padding: 6px; gap: 6px; }
    .wood-panel { background: linear-gradient(100deg, rgba(103,59,32,.98), rgba(63,32,19,.98)); border: 2px solid #b77a3c; box-shadow: inset 0 0 0 2px rgba(32,15,7,.55); color: white; border-radius: 12px; padding: 8px; }
    .paper-panel { background: #f3dfaf; background-image: repeating-linear-gradient(0deg, rgba(101,61,28,.05) 0 1px, transparent 1px 6px); border: 3px solid #74421f; border-radius: 12px; }
    .left-section { flex: 1.1; display: flex; flex-direction: column; gap: 6px; height: 100%; }
    .hud-bar { display: flex; justify-content: space-between; align-items: center; height: 16%; }
    .hud-info { display: flex; flex-direction: column; }
    .hud-title { font-size: 13px; font-weight: bold; color: var(--gold); }
    .hud-time { font-size: 10px; color: #6ee7b7; font-weight: bold; margin-top: 1px; }
    .hud-stats { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: bold; }
    .stat-badge { background: #2e180e; padding: 3px 6px; border-radius: 6px; border: 1px solid #b77a3c; }
    .btn-action { background: linear-gradient(to right, #f59e0b, #ca8a04); color: #451a03; padding: 3px 6px; border-radius: 6px; font-size: 9px; font-weight: 900; border: 1px solid #fde047; cursor: pointer; }
    .btn-action.hidden { display: none; }

    .shop-scene { position: relative; flex-grow: 1; background: repeating-linear-gradient(90deg, #704424 0 48px, #5a311b 49px 52px); border: 4px solid #331a0d; border-radius: 12px; }
    .shop-scene.upgraded { background: repeating-linear-gradient(90deg, #834c24 0 48px, #5b2d16 49px 52px); }
    .floor { position:absolute; bottom:0; left:0; right:0; height:45px; background: #3c2315; border-top: 4px solid #1f1009; z-index: 10; }
    .table-top { position:absolute; left:5%; right:5%; bottom:40px; height:20px; border: 3px solid var(--furniture-border); border-radius: 6px; background: var(--furniture-color); z-index: 20; transition: all 0.3s ease; }
    
    .customer-slot { position:absolute; bottom:48px; width:110px; text-align:center; z-index: 40; display: none; }
    .customer-slot.active { display: block; }
    #slot-0 { left: 10%; } #slot-1 { left: 42%; } #slot-2 { left: 74%; }
    
    .bubble { position:relative; margin:0 auto 4px; width:110px; padding:4px; border:2px solid #59331d; border-radius:8px; background:#fff4d7; font-size:10px; font-weight:700; line-height:1.2; color: var(--ink); }
    .bubble:after { content:""; position:absolute; bottom:-7px; left:44%; width:8px; height:8px; background:#fff4d7; border-right:2px solid #59331d; border-bottom:2px solid #59331d; transform:rotate(45deg); }
    .avatar { font-size:42px; filter: drop-shadow(2px 2px 0 #2d170c); line-height:1; }
    .patience { width:70px; height:6px; margin:2px auto; background:#331a10; border:1px solid #e0bd74; border-radius:99px; overflow:hidden; }
    .patience-fill { height:100%; width:100%; background:#4caf50; transform-origin:left; }
    
    .right-section { flex: 1.9; display: flex; gap: 6px; height: 100%; padding: 6px; }
    .menu-panel { flex: 1.1; overflow-y: auto; padding-right: 4px; }
    .menu-title { font-size: 10px; font-weight: 900; color: #7f1d1d; border-bottom: 1px solid rgba(127,29,29,0.2); margin-bottom: 4px; margin-top: 4px; }
    .menu-title.sayur { color: #14532d; border-bottom-color: rgba(20,83,45,0.2); }
    .menu-title.berat { color: #78350f; border-bottom-color: rgba(120,53,15,0.2); }
    .menu-title.premium { color: #581c87; border-bottom-color: rgba(88,28,135,0.2); }
    .management-panel { flex: 0.9; display: flex; flex-direction: column; gap: 5px; border-left: 2px dashed #74421f; padding-left: 6px; font-size: 9px; font-weight: bold; color: #59331d; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 4px; margin-bottom: 4px; }
    .menu-button { text-align: center; padding: 4px; border-radius: 6px; border: 1px solid rgba(92,48,19,.55); background: rgba(255,250,225,0.9); font-weight: 700; cursor: pointer; font-size: 10px; color: var(--ink); }
    .menu-button:hover { background: #9b1d1d; color: #fff6d7; }
    
    .stove-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
    .stove-box { aspect-ratio: 1.5; border-radius: 8px; border: 2px solid #401d0e; background: linear-gradient(100deg, #944920, #753617); position: relative; cursor: pointer; }
    .stove-rim { position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px; border-radius: 6px; background: #23120b; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
    .stove-fire { font-size: 9px; animation: flicker 0.4s infinite alternate; }
    @keyframes flicker { to { transform: scale(1.1); color: #f45b23; } }

    .storage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; background: #4a2711; padding: 4px; border-radius: 6px; }
    .storage-slot { aspect-ratio: 1; background: #fff4d7; border: 1px solid #74421f; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 14px; cursor: pointer; position: relative; }
    .fresh-bar { position: absolute; bottom: 1px; left: 2px; right: 2px; height: 3px; background: #22c55e; border-radius: 1px; }

    .tray-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .btn-clear-tray { font-size: 8px; background: #991b1b; color: white; padding: 1px 4px; border: none; cursor: pointer; border-radius: 3px; }
    .tray-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; background: #283725; padding: 4px; border-radius: 6px; border: 1px solid #3c6e31; }
    .tray-slot { aspect-ratio: 1; background: #e2fcdb; border: 1px solid #35622a; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; }

    .upgrade-section-box { background: rgba(255,255,255,0.25); border: 1px solid #74421f; border-radius: 6px; padding: 4px; display: flex; flex-direction: column; gap: 3px; }
    .up-row { display: flex; justify-content: space-between; align-items: center; }
    .btn-mini-buy { font-size: 8px; background: #15803d; color: white; padding: 2px 4px; border: none; cursor: pointer; border-radius: 3px; font-weight: bold; }
    .btn-mini-buy:hover { background: #16a34a; }

    .report-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 100; }
    .scroll-paper { background: #fdf3d3; border: 6px double #8b4513; width: 340px; padding: 16px; border-radius: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; color: #3e2723; }
    .scroll-title { font-size: 15px; font-weight: 800; border-bottom: 2px dashed #8b4513; padding-bottom: 6px; color: #7f1d1d; }
    .report-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; margin: 6px 0; border-bottom: 1px dotted rgba(0,0,0,0.1); }
    .btn-close-report { background: #5d4037; color: white; font-weight: bold; border: none; padding: 6px 16px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-top: 10px; width: 100%; }

    .pop-alert { position: absolute; font-weight: 800; font-size: 13px; left: 0; right: 0; margin: 0 auto; top: -12px; animation: popUp 0.8s ease-out forwards; pointer-events: none; z-index: 50; }
    @keyframes popUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }
  </style>
</head>
<body>

  <div id="warning-screen">
    <div style="font-size: 40px; margin-bottom: 10px;">🔄</div>
    <p>Aktifkan 'Rotasi Otomatis' HP kamu,<br>lalu miringkan HP ke posisi Landscape untuk bermain!</p>
  </div>

  <div class="game-container select-none">
    <div class="left-section">
      <div class="wood-panel hud-bar">
        <div class="hud-info">
          <div class="hud-title" id="shop-title">🏮 Warung Makan Dinasti</div>
          <div class="hud-time" id="clock-display">📅 Hari 1 · 🕐 06:00 Pagi</div>
          <div class="hud-time" id="weather-display" style="color:#f59e0b;">🌤️ Cuaca: Cerah Sinar Mas</div>
        </div>
        <div class="hud-stats">
          <div class="stat-badge">🪙 <span id="coin-count">0</span></div>
          <div class="stat-badge">⭐ Lv.<span id="level-count">1</span></div>
          <button id="btn-upgrade" onclick="upgradeToko()" class="btn-action hidden">Upgrade Slot</button>
          <button onclick="resetDataGame()" class="btn-action" style="background:#991b1b; color:white; border:none;">Reset</button>
        </div>
      </div>

      <div class="shop-scene" id="shop-area">
        <div id="slot-0" class="customer-slot active" onclick="layaniPelanggan(0)">
