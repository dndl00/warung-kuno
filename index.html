<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Warung Makan Kuno China - Portrait Android Edition</title>
  <style>
    :root {
      --ink: #28170e;
      --wood: #59331d;
      --wood-dark: #2e180e;
      --paper: #f3dfaf;
      --red: #9b1d1d;
      --gold: #eab95e;
      --furniture-color: linear-gradient(#9e5e2d, #643316);
      --furniture-border: #2d160a;
    }
    * { box-shadow: none; box-sizing: border-box; margin: 0; padding: 0; }
    
    body, html {
      width: 100%; height: 100%; background: #23150e;
      font-family: "Georgia", serif; overflow: hidden;
    }

    /* Layout Bertingkat Khusus Portrait HP */
    .game-container { 
      display: flex; flex-direction: column;
      width: 100%; height: 100%; padding: 4px; gap: 4px;
    }
    
    .wood-panel { background: linear-gradient(100deg, rgba(103,59,32,.98), rgba(63,32,19,.98)); border: 2px solid #b77a3c; color: white; border-radius: 8px; padding: 4px 8px; }
    .paper-panel { background: #f3dfaf; background-image: repeating-linear-gradient(0deg, rgba(101,61,28,.05) 0 1px, transparent 1px 6px); border: 2px solid #74421f; border-radius: 8px; padding: 4px; }
    
    /* 1. HUD ATAS (Tinggi 10%) */
    .hud-bar { display: flex; justify-content: space-between; align-items: center; height: 10%; }
    .hud-info { display: flex; flex-direction: column; }
    .hud-title { font-size: 11px; font-weight: bold; color: var(--gold); }
    .hud-time { font-size: 8px; color: #6ee7b7; font-weight: bold; }
    .hud-stats { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: bold; }
    .stat-badge { background: #2e180e; padding: 2px 4px; border-radius: 4px; border: 1px solid #b77a3c; }
    .btn-action { background: linear-gradient(to right, #f59e0b, #ca8a04); color: #451a03; padding: 2px 4px; border-radius: 4px; font-size: 8px; font-weight: 900; border: 1px solid #fde047; cursor: pointer; }
    .btn-action.hidden { display: none; }

    /* 2. AREA MEJA & PELANGGAN (Tinggi 24%) */
    .shop-scene { 
      position: relative; height: 24%; 
      background: repeating-linear-gradient(90deg, #704424 0 40px, #5a311b 41px 44px); 
      border: 3px solid #331a0d; border-radius: 8px; overflow: hidden;
    }
    .shop-scene.upgraded { background: repeating-linear-gradient(90deg, #834c24 0 40px, #5b2d16 41px 44px); }
    .floor { position:absolute; bottom:0; left:0; right:0; height:24px; background: #3c2315; border-top: 3px solid #1f1009; z-index: 10; }
    .table-top { position:absolute; left:4%; right:4%; bottom:20px; height:12px; border: 2px solid var(--furniture-border); border-radius: 4px; background: var(--furniture-color); z-index: 20; transition: all 0.3s ease; }
    
    .customer-slot { position:absolute; bottom:24px; width:80px; text-align:center; z-index: 40; display: none; }
    .customer-slot.active { display: block; }
    #slot-0 { left: 6%; } #slot-1 { left: 38%; } #slot-2 { left: 70%; }
    
    .bubble { position:relative; margin:0 auto 1px; width:85px; padding:2px; border:1.5px solid #59331d; border-radius:5px; background:#fff4d7; font-size:8px; font-weight:700; line-height:1.1; color: var(--ink); }
    .bubble:after { content:""; position:absolute; bottom:-5px; left:44%; width:5px; height:5px; background:#fff4d7; border-right:1.5px solid #59331d; border-bottom:1.5px solid #59331d; transform:rotate(45deg); }
    .avatar { font-size:28px; filter: drop-shadow(1px 1px 0 #2d170c); line-height:1; }
    .patience { width:50px; height:4px; margin:1px auto; background:#331a10; border:1px solid #e0bd74; border-radius:99px; overflow:hidden; }
    .patience-fill { height:100%; width:100%; background:#4caf50; transform-origin:left; }
    
    /* 3. PANEL TENGAH: MANAGEMENT UTENSILS (Tinggi 24%) */
    .middle-management {
      display: flex; height: 24%; gap: 4px; font-size: 8px; font-weight: bold; color: #59331d;
    }
    .mgmt-box { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 4px; }
    .stove-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .stove-box { aspect-ratio: 1.3; border-radius: 4px; border: 1.5px solid #401d0e; background: linear-gradient(100deg, #944920, #753617); position: relative; cursor: pointer; }
    .stove-rim { position: absolute; top: 1px; left: 1px; right: 1px; bottom: 1px; border-radius: 2px; background: #23120b; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
    
    .storage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #4a2711; padding: 2px; border-radius: 4px; }
    .storage-slot { aspect-ratio: 1; background: #fff4d7; border: 1px solid #74421f; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 12px; cursor: pointer; position: relative; }
    .fresh-bar { position: absolute; bottom: 1px; left: 1px; right: 1px; height: 2px; background: #22c55e; }

    .tray-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #283725; padding: 2px; border-radius: 4px; border: 1px solid #3c6e31; }
    .tray-slot { aspect-ratio: 1; background: #e2fcdb; border: 1px solid #35622a; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 12px; cursor: pointer; }

    /* 4. AREA BAWAH: BUKU RESEP GULIR (Tinggi 40%) */
    .menu-panel { flex: 1; overflow-y: auto; height: 40%; }
    .menu-title { font-size: 9px; font-weight: 900; color: #7f1d1d; border-bottom: 1px solid rgba(127,29,29,0.2); margin-bottom: 2px; margin-top: 2px; }
    .menu-title.sayur { color: #14532d; border-bottom-color: rgba(20,83,45,0.2); }
    .menu-title.berat { color: #78350f; border-bottom-color: rgba(120,53,15,0.2); }
    .menu-title.premium { color: #581c87; border-bottom-color: rgba(88,28,135,0.2); }
    .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
    .menu-button { text-align: center; padding: 3px 1px; border-radius: 4px; border: 1px solid rgba(92,48,19,.55); background: rgba(255,250,225,0.9); font-weight: 700; cursor: pointer; font-size: 8px; color: var(--ink); }

    .upgrade-section-box { background: rgba(255,255,255,0.25); border: 1px solid #74421f; border-radius: 4px; padding: 2px; display: flex; justify-content: space-between; gap: 4px; font-size: 8px; width: 100%; margin-top: 2px; }

    /* POPUP OVERLAY REKAP */
    .report-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
    .scroll-paper { background: #fdf3d3; border: 4px double #8b4513; width: 280px; padding: 10px; border-radius: 4px; text-align: center; color: #3e2723; }
    .scroll-title { font-size: 12px; font-weight: 800; border-bottom: 1.5px dashed #8b4513; padding-bottom: 2px; color: #7f1d1d; }
    .report-row { display: flex; justify-content: space-between; font-size: 9px; font-weight: bold; margin: 4px 0; border-bottom: 1px dotted rgba(0,0,0,0.1); }
    .btn-close-report { background: #5d4037; color: white; font-weight: bold; border: none; padding: 4px; border-radius: 4px; font-size: 9px; cursor: pointer; margin-top: 4px; width: 100%; }

    .pop-alert { position: absolute; font-weight: 800; font-size: 10px; left: 0; right: 0; margin: 0 auto; top: -8px; animation: popUp 0.8s ease-out forwards; pointer-events: none; z-index: 50; }
    @keyframes popUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-12px); } }
  </style>
</head>
<body>

  <div class="game-container select-none">
    
    <!-- LEVEL 1: STATUS HUD (10%) -->
    <div class="wood-panel hud-bar">
      <div class="hud-info">
        <div class="hud-title" id="shop-title">🏮 Warung Kuno (Portrait)</div>
        <div class="hud-time" id="clock-display">📅 Hari 1 · 🕐 06:00 · 🌤️ Cerah</div>
      </div>
      <div class="hud-stats">
        <div class="stat-badge">🪙 <span id="coin-count">0</span></div>
        <div class="stat-badge">⭐ Lv.<span id="level-count">1</span></div>
        <button id="btn-upgrade" onclick="upgradeToko()" class="btn-action hidden">Upgrade</button>
        <button onclick="resetDataGame()" class="btn-action" style="background:#991b1b; color:white; border:none;">Reset</button>
      </div>
    </div>

    <!-- LEVEL 2: ARENA MEJA PELANGGAN (24%) -->
    <div class="shop-scene" id="shop-area">
      <div id="slot-0" class="customer-slot active" onclick="layaniPelanggan(0)">
        <div class="bubble" id="bubble-0">Menunggu...</div>
        <div class="avatar" id="avatar-0">🧔</div>
        <div class="patience"><div class="patience-fill"></div></div>
      </div>
      <div id="slot-1" class="customer-slot active" onclick="layaniPelanggan(1)">
        <div class="bubble" id="bubble-1">Menunggu...</div>
        <div class="avatar" id="avatar-1">🧕</div>
        <div class="patience"><div class="patience-fill"></div></div>
      </div>
      <div id="slot-2" class="customer-slot" onclick="layaniPelanggan(2)">
        <div class="bubble" id="bubble-2">Menunggu...</div>
        <div class="avatar" id="avatar-2">🧑‍🌾</div>
        <div class="patience"><div class="patience-fill"></div></div>
      </div>
      <div class="floor"></div>
      <div class="table-top" id="furniture-table"></div>
    </div>

    <!-- LEVEL 3: DAPUR & MANAJEMEN RAK ALAT (24%) -->
    <div class="paper-panel middle-management">
      <div class="mgmt-box" style="border-right: 1px dashed #74421f;">
        <div class="tray-header"><span>🍽️ Nampan (Maks 5):</span><button onclick="buangNampan()" class="btn-clear-tray">X</button></div>
        <div class="tray-grid" id="tray-container"></div>
        <span>📦 Rak Lemari (Maks 10):</span>
