<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Simulasi Warung Makan Kuno China - Ultimate Android Edition</title>
  <style>
    :root {
      --ink: #28170e;
      --wood: #59331d;
      --wood-dark: #2e180e;
      --paper: #f3dfaf;
      --red: #9b1d1d;
      --gold: #eab95e;
      --furniture-color: linear-gradient(#9e5e2d, #643316);
      --furniture-border: #2d160a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* FIX ANDROID CHROME: Menggunakan flex tinggi dinamis agar tidak terpotong bar browser */
    body, html {
      width: 100%;
      height: 100%;
      background: #23150e;
      font-family: "Georgia", serif;
      overflow: hidden;
    }

    @media screen and (orientation: portrait) {
      #warning-screen { display: flex !important; }
      .game-container { display: none !important; }
    }
    
    #warning-screen {
      display: none; width: 100vw; height: 100vh; background: #23150e;
      color: #eab95e; flex-direction: column; justify-content: center;
      align-items: center; text-align: center; padding: 20px; font-weight: bold;
      font-size: 14px;
    }

    /* Container utama menggunakan tinggi 100% dari ruang yang tersedia */
    .game-container { 
      display: flex; 
      width: 100%; 
      height: 100%; 
      padding: 4px; 
      gap: 4px;
    }
    
    .wood-panel { background: linear-gradient(100deg, rgba(103,59,32,.98), rgba(63,32,19,.98)); border: 2px solid #b77a3c; box-shadow: inset 0 0 0 2px rgba(32,15,7,.55); color: white; border-radius: 8px; padding: 4px 8px; }
    .paper-panel { background: #f3dfaf; background-image: repeating-linear-gradient(0deg, rgba(101,61,28,.05) 0 1px, transparent 1px 6px); border: 2px solid #74421f; border-radius: 8px; }
    
    /* AREA KIRI: Pelanggan & Info (Tinggi Otomatis Pas) */
    .left-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      height: 100%;
    }

    .hud-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      height: 18%; 
    }
    .hud-info { display: flex; flex-direction: column; }
    .hud-title { font-size: 11px; font-weight: bold; color: var(--gold); }
    .hud-time { font-size: 9px; color: #6ee7b7; font-weight: bold; }
    .hud-stats { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: bold; }
    .stat-badge { background: #2e180e; padding: 2px 4px; border-radius: 4px; border: 1px solid #b77a3c; }
    
    .btn-action { background: linear-gradient(to right, #f59e0b, #ca8a04); color: #451a03; padding: 2px 4px; border-radius: 4px; font-size: 9px; font-weight: 900; border: 1px solid #fde047; cursor: pointer; }
    .btn-action.hidden { display: none; }

    .shop-scene { 
      position: relative; 
      flex: 1; 
      background: repeating-linear-gradient(90deg, #704424 0 48px, #5a311b 49px 52px); 
      border: 3px solid #331a0d; 
      border-radius: 8px;
      overflow: hidden;
    }
    .shop-scene.upgraded { background: repeating-linear-gradient(90deg, #834c24 0 48px, #5b2d16 49px 52px); }
    .floor { position:absolute; bottom:0; left:0; right:0; height:30px; background: #3c2315; border-top: 3px solid #1f1009; z-index: 10; }
    .table-top { position:absolute; left:4%; right:4%; bottom:26px; height:15px; border: 2px solid var(--furniture-border); border-radius: 4px; background: var(--furniture-color); z-index: 20; transition: all 0.3s ease; }
    
    .customer-slot { position:absolute; bottom:32px; width:90px; text-align:center; z-index: 40; display: none; }
    .customer-slot.active { display: block; }
    #slot-0 { left: 8%; } #slot-1 { left: 40%; } #slot-2 { left: 72%; }
    
    .bubble { position:relative; margin:0 auto 2px; width:95px; padding:2px; border:1.5px solid #59331d; border-radius:6px; background:#fff4d7; font-size:9px; font-weight:700; line-height:1.1; color: var(--ink); }
    .bubble:after { content:""; position:absolute; bottom:-6px; left:44%; width:6px; height:6px; background:#fff4d7; border-right:1.5px solid #59331d; border-bottom:1.5px solid #59331d; transform:rotate(45deg); }
    .avatar { font-size:32px; filter: drop-shadow(1px 1px 0 #2d170c); line-height:1; }
    .patience { width:60px; height:5px; margin:1px auto; background:#331a10; border:1px solid #e0bd74; border-radius:99px; overflow:hidden; }
    .patience-fill { height:100%; width:100%; background:#4caf50; transform-origin:left; }
    
    /* AREA KANAN: Dapur Manajemen (Tinggi 100% pas layar) */
    .right-section { 
      flex: 1.5; 
      display: flex; 
      gap: 4px; 
      height: 100%; 
      padding: 4px; 
    }
    
    .menu-panel { flex: 1.1; overflow-y: auto; padding-right: 2px; height: 100%; }
    .menu-title { font-size: 9px; font-weight: 900; color: #7f1d1d; border-bottom: 1px solid rgba(127,29,29,0.2); margin-bottom: 2px; margin-top: 2px; }
    .menu-title.sayur { color: #14532d; border-bottom-color: rgba(20,83,45,0.2); }
    .menu-title.berat { color: #78350f; border-bottom-color: rgba(120,53,15,0.2); }
    .menu-title.premium { color: #581c87; border-bottom-color: rgba(88,28,135,0.2); }
    
    .management-panel { 
      flex: 0.9; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
      height: 100%;
      border-left: 2px dashed #74421f; 
      padding-left: 4px; 
      font-size: 8px; 
      font-weight: bold; 
      color: #59331d; 
    }
    
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 3px; margin-bottom: 3px; }
    .menu-button { text-align: center; padding: 2px; border-radius: 4px; border: 1px solid rgba(92,48,19,.55); background: rgba(255,250,225,0.9); font-weight: 700; cursor: pointer; font-size: 9px; color: var(--ink); }
    .menu-button:hover { background: #9b1d1d; color: #fff6d7; }
    
    .stove-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .stove-box { aspect-ratio: 1.4; border-radius: 6px; border: 1.5px solid #401d0e; background: linear-gradient(100deg, #944920, #753617); position: relative; cursor: pointer; }
    .stove-rim { position: absolute; top: 1px; left: 1px; right: 1px; bottom: 1px; border-radius: 4px; background: #23120b; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
    .stove-fire { font-size: 8px; animation: flicker 0.4s infinite alternate; }
    @keyframes flicker { to { transform: scale(1.1); color: #f45b23; } }

    .storage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #4a2711; padding: 3px; border-radius: 4px; }
    .storage-slot { aspect-ratio: 1; background: #fff4d7; border: 1px solid #74421f; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 14px; cursor: pointer; position: relative; }
    .fresh-bar { position: absolute; bottom: 1px; left: 1px; right: 1px; height: 2px; background: #22c55e; border-radius: 1px; }

    .tray-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .btn-clear-tray { font-size: 7px; background: #991b1b; color: white; padding: 1px 3px; border: none; cursor: pointer; border-radius: 2px; }
    .tray-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #283725; padding: 3px; border-radius: 4px; border: 1px solid #3c6e31; }
    .tray-slot { aspect-ratio: 1; background: #e2fcdb; border: 1px solid #35622a; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 14px; cursor: pointer; }

    .upgrade-section-box { background: rgba(255,255,255,0.25); border: 1px solid #74421f; border-radius: 4px; padding: 2px; display: flex; flex-direction: column; gap: 2px; }
    .up-row { display: flex; justify-content: space-between; align-items: center; }
    .btn-mini-buy { font-size: 7px; background: #15803d; color: white; padding: 1px 3px; border: none; cursor: pointer; border-radius: 2px; font-weight: bold; }

    /* POPUP REKAP MODAL */
    .report-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
    .scroll-paper { background: #fdf3d3; border: 4px double #8b4513; width: 290px; padding: 10px; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-align: center; color: #3e2723; }
    .scroll-title { font-size: 13px; font-weight: 800; border-bottom: 2px dashed #8b4513; padding-bottom: 4px; color: #7f1d1d; }
    .report-row { display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; margin: 4px 0; border-bottom: 1px dotted rgba(0,0,0,0.1); }
    .btn-close-report { background: #5d4037; color: white; font-weight: bold; border: none; padding: 4px 10px; border-radius: 4px; font-size: 10px; cursor: pointer; margin-top: 6px; width: 100%; }

    .pop-alert { position: absolute; font-weight: 800; font-size: 11px; left: 0; right: 0; margin: 0 auto; top: -10px; animation: popUp 0.8s ease-out forwards; pointer-events: none; z-index: 50; }
    @keyframes popUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-15px); } }
  </style>
</head>
<body>

  <!-- LOADING / WARNING SCREEN ROTASI -->
  <div id="warning-screen">
    <div style="font-size: 30px; margin-bottom: 6px;">🔄</div>
    <p>Aktifkan 'Rotasi Otomatis' HP kamu,<br>lalu miringkan HP ke posisi Landscape untuk bermain!</p>
  </div>

  <!-- CONTAINER UTAMA GAME -->
  <div class="game-container select-none">
    
    <!-- DASHBOARD JUALAN (KIRI) -->
    <div class="left-section">
      <div class="wood-panel hud-bar">
        <div class="hud-info">
          <div class="hud-title" id="shop-title">🏮 Warung Makan Dinasti</div>
